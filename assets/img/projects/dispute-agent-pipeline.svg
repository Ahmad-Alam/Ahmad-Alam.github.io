<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="620" fill="#ffffff"/>

  <defs>
    <marker id="arrowA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8a94a3"/>
    </marker>
    <marker id="arrowA-grey" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b3b3b3"/>
    </marker>
  </defs>

  <!-- Box: webhook -->
  <rect x="30" y="255" width="160" height="110" rx="10" fill="#eef1f5" stroke="#8a94a3" stroke-width="2"/>
  <text x="110" y="300" font-size="17" fill="#2b2b2b" text-anchor="middle">PayPal</text>
  <text x="110" y="320" font-size="17" fill="#2b2b2b" text-anchor="middle">webhook</text>
  <text x="110" y="345" font-size="11" fill="#666666" text-anchor="middle">dispute event</text>

  <line x1="190" y1="310" x2="240" y2="310" stroke="#8a94a3" stroke-width="2" marker-end="url(#arrowA)"/>

  <!-- Box: queue -->
  <rect x="240" y="260" width="140" height="100" rx="10" fill="#eef1f5" stroke="#8a94a3" stroke-width="2"/>
  <text x="310" y="300" font-size="16" fill="#2b2b2b" text-anchor="middle">Queue</text>
  <text x="310" y="322" font-size="11" fill="#666666" text-anchor="middle">dedup by dispute_id</text>

  <line x1="380" y1="310" x2="430" y2="310" stroke="#8a94a3" stroke-width="2" marker-end="url(#arrowA)"/>

  <!-- Box: evidence collector, above -->
  <rect x="430" y="90" width="220" height="110" rx="10" fill="#e3ecfa" stroke="#5a86c9" stroke-width="2"/>
  <text x="540" y="130" font-size="16" font-weight="700" fill="#2b2b2b" text-anchor="middle">Evidence collector</text>
  <text x="540" y="152" font-size="11" fill="#3f5f96" text-anchor="middle">tracking, refund status,</text>
  <text x="540" y="168" font-size="11" fill="#3f5f96" text-anchor="middle">order lookup, 3-tier fallback</text>

  <line x1="540" y1="200" x2="540" y2="255" stroke="#5a86c9" stroke-width="2" marker-end="url(#arrowA)"/>

  <!-- Box: dispute processor -->
  <rect x="430" y="255" width="220" height="110" rx="10" fill="#fdf3e3" stroke="#c9a24a" stroke-width="2"/>
  <text x="540" y="295" font-size="16" font-weight="700" fill="#2b2b2b" text-anchor="middle">Dispute processor</text>
  <text x="540" y="317" font-size="11" fill="#8a6d1f" text-anchor="middle">stage detection,</text>
  <text x="540" y="333" font-size="11" fill="#8a6d1f" text-anchor="middle">routes to 1 of 10 agents</text>

  <line x1="650" y1="310" x2="700" y2="310" stroke="#8a94a3" stroke-width="2" marker-end="url(#arrowA)"/>

  <!-- Box: specialist agent -->
  <rect x="700" y="255" width="230" height="110" rx="10" fill="#e3f3e9" stroke="#4fae7a" stroke-width="2"/>
  <text x="815" y="295" font-size="16" font-weight="700" fill="#2b2b2b" text-anchor="middle">Specialist agent</text>
  <text x="815" y="317" font-size="11" fill="#3d8a63" text-anchor="middle">tracks offer_history and</text>
  <text x="815" y="333" font-size="11" fill="#3d8a63" text-anchor="middle">current_offer_level</text>

  <line x1="930" y1="310" x2="980" y2="310" stroke="#8a94a3" stroke-width="2" marker-end="url(#arrowA)"/>

  <!-- Box: paypal api -->
  <rect x="980" y="255" width="190" height="110" rx="10" fill="#eef1f5" stroke="#8a94a3" stroke-width="2"/>
  <text x="1075" y="295" font-size="16" font-weight="700" fill="#2b2b2b" text-anchor="middle">PayPal API</text>
  <text x="1075" y="317" font-size="11" fill="#666666" text-anchor="middle">message, offer,</text>
  <text x="1075" y="333" font-size="11" fill="#666666" text-anchor="middle">or evidence</text>

  <!-- caption -->
  <text x="600" y="560" font-size="16" fill="#4a4a4a" text-anchor="middle">One dispute, one specialist agent, evidence gathered before the model ever runs.</text>

</svg>
