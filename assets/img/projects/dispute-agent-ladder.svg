<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="620" fill="#ffffff"/>

  <defs>
    <marker id="arrowB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8a94a3"/>
    </marker>
    <marker id="arrowB-grey" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b3b3b3"/>
    </marker>
  </defs>

  <!-- top row arrows: declines -->
  <line x1="240" y1="300" x2="270" y2="300" stroke="#8a94a3" stroke-width="2" marker-end="url(#arrowB)"/>
  <line x1="470" y1="300" x2="500" y2="300" stroke="#8a94a3" stroke-width="2" marker-end="url(#arrowB)"/>
  <line x1="700" y1="300" x2="730" y2="300" stroke="#8a94a3" stroke-width="2" marker-end="url(#arrowB)"/>
  <line x1="930" y1="300" x2="960" y2="300" stroke="#8a94a3" stroke-width="2" marker-end="url(#arrowB)"/>
  <text x="255" y="285" font-size="11" fill="#999999" text-anchor="middle">declines</text>
  <text x="485" y="285" font-size="11" fill="#999999" text-anchor="middle">declines</text>
  <text x="715" y="285" font-size="11" fill="#999999" text-anchor="middle">declines</text>
  <text x="945" y="285" font-size="11" fill="#999999" text-anchor="middle">declines</text>

  <!-- Box 1: initial touch -->
  <rect x="40" y="220" width="200" height="160" rx="10" fill="#eef1f5" stroke="#8a94a3" stroke-width="2"/>
  <text x="140" y="255" font-size="15" font-weight="700" fill="#2b2b2b" text-anchor="middle">Initial touch</text>
  <text x="140" y="280" font-size="11" fill="#666666" text-anchor="middle">ask for details</text>
  <text x="140" y="296" font-size="11" fill="#666666" text-anchor="middle">or evidence</text>
  <text x="140" y="322" font-size="11" fill="#8a94a3" text-anchor="middle">level 0</text>

  <!-- Box 2: offer 1 -->
  <rect x="270" y="220" width="200" height="160" rx="10" fill="#fdf3e3" stroke="#c9a24a" stroke-width="2"/>
  <text x="370" y="255" font-size="15" font-weight="700" fill="#2b2b2b" text-anchor="middle">Offer 1</text>
  <text x="370" y="280" font-size="11" fill="#8a6d1f" text-anchor="middle">30% coupon +</text>
  <text x="370" y="296" font-size="11" fill="#8a6d1f" text-anchor="middle">reshipment, or</text>
  <text x="370" y="312" font-size="11" fill="#8a6d1f" text-anchor="middle">return address</text>
  <text x="370" y="336" font-size="11" fill="#a3862f" text-anchor="middle">level 1</text>

  <!-- Box 3: offer 2 -->
  <rect x="500" y="220" width="200" height="160" rx="10" fill="#fdf3e3" stroke="#c9a24a" stroke-width="2"/>
  <text x="600" y="255" font-size="15" font-weight="700" fill="#2b2b2b" text-anchor="middle">Offer 2</text>
  <text x="600" y="280" font-size="11" fill="#8a6d1f" text-anchor="middle">120% coupon, or</text>
  <text x="600" y="296" font-size="11" fill="#8a6d1f" text-anchor="middle">50% coupon +</text>
  <text x="600" y="312" font-size="11" fill="#8a6d1f" text-anchor="middle">50% refund</text>
  <text x="600" y="336" font-size="11" fill="#a3862f" text-anchor="middle">level 2</text>

  <!-- Box 4: offer 3 -->
  <rect x="730" y="220" width="200" height="160" rx="10" fill="#fdf3e3" stroke="#c9a24a" stroke-width="2"/>
  <text x="830" y="255" font-size="15" font-weight="700" fill="#2b2b2b" text-anchor="middle">Offer 3</text>
  <text x="830" y="280" font-size="11" fill="#8a6d1f" text-anchor="middle">150% coupon, or</text>
  <text x="830" y="296" font-size="11" fill="#8a6d1f" text-anchor="middle">30% coupon +</text>
  <text x="830" y="312" font-size="11" fill="#8a6d1f" text-anchor="middle">70% refund</text>
  <text x="830" y="336" font-size="11" fill="#a3862f" text-anchor="middle">level 3</text>

  <!-- Box 5: full refund + human -->
  <rect x="960" y="220" width="200" height="160" rx="10" fill="#fbe4e4" stroke="#d97a7a" stroke-width="2"/>
  <text x="1060" y="255" font-size="15" font-weight="700" fill="#2b2b2b" text-anchor="middle">Full refund</text>
  <text x="1060" y="280" font-size="11" fill="#b25555" text-anchor="middle">plus escalation</text>
  <text x="1060" y="296" font-size="11" fill="#b25555" text-anchor="middle">to a human team</text>
  <text x="1060" y="336" font-size="11" fill="#b25555" text-anchor="middle">counter never resets</text>

  <!-- dashed accept branches -->
  <line x1="140" y1="380" x2="140" y2="430" stroke="#b3b3b3" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowB-grey)"/>
  <line x1="370" y1="380" x2="370" y2="430" stroke="#b3b3b3" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowB-grey)"/>
  <line x1="600" y1="380" x2="600" y2="430" stroke="#b3b3b3" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowB-grey)"/>
  <line x1="830" y1="380" x2="830" y2="430" stroke="#b3b3b3" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowB-grey)"/>

  <ellipse cx="140" cy="465" rx="85" ry="26" fill="#ffffff" stroke="#b3b3b3" stroke-width="2"/>
  <text x="140" y="462" font-size="11" fill="#888888" text-anchor="middle">accepts,</text>
  <text x="140" y="477" font-size="11" fill="#888888" text-anchor="middle">resolved</text>

  <ellipse cx="370" cy="465" rx="85" ry="26" fill="#ffffff" stroke="#b3b3b3" stroke-width="2"/>
  <text x="370" y="462" font-size="11" fill="#888888" text-anchor="middle">accepts,</text>
  <text x="370" y="477" font-size="11" fill="#888888" text-anchor="middle">resolved</text>

  <ellipse cx="600" cy="465" rx="85" ry="26" fill="#ffffff" stroke="#b3b3b3" stroke-width="2"/>
  <text x="600" y="462" font-size="11" fill="#888888" text-anchor="middle">accepts,</text>
  <text x="600" y="477" font-size="11" fill="#888888" text-anchor="middle">resolved</text>

  <ellipse cx="830" cy="465" rx="85" ry="26" fill="#ffffff" stroke="#b3b3b3" stroke-width="2"/>
  <text x="830" y="462" font-size="11" fill="#888888" text-anchor="middle">accepts,</text>
  <text x="830" y="477" font-size="11" fill="#888888" text-anchor="middle">resolved</text>

  <!-- caption -->
  <text x="600" y="560" font-size="16" fill="#4a4a4a" text-anchor="middle">The level counter only moves one direction. Nothing resets it and nothing repeats a tier.</text>

</svg>
